name: photo_wall_flutter
description: "留言/日记/照片墙 Flutter 应用 - 支持 Android / iOS / Web 三端"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# =============================================================================
# 依赖配置说明
# =============================================================================
# 依赖按职责分组：状态管理 / 网络 / 路由 / 数据库 / 国际化 / 存储 / 工具 / UI
# 所有第三方依赖均在此声明，符合 CLAUDE.md 规范。
# =============================================================================
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- 状态管理 ----
  # Riverpod 3.x：核心状态管理框架，使用 AsyncNotifier / Notifier 范式
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.0

  # ---- 数据模型 ----
  # freezed_annotation / json_annotation：freezed 与 json_serializable 运行时注解
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ---- 网络请求 ----
  # dio：高度封装的 HTTP 客户端，支持拦截器链、统一错误处理
  dio: ^5.9.2

  # ---- 路由 ----
  # go_router：Flutter 官方推荐声明式路由，支持 Web URL 同步、深链、嵌套路由、守卫
  go_router: ^16.0.0

  # ---- 本地数据库（类 Android Room） ----
  # drift：类型安全、响应式 SQLite ORM，用于弱网下首页列表缓存优先展示
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ---- 国际化 ----
  # intl：配合 flutter_localizations 实现 arb 文件代码生成
  intl: any

  # ---- 存储与工具 ----
  shared_preferences: ^2.3.2    # 主题模式等简单 KV 持久化
  connectivity_plus: ^6.0.5     # 弱网/无网状态检测
  cached_network_image: ^3.4.1  # 网络图片加载与缓存
  logger: ^2.4.0                # 结构化日志

  # ---- UI ----
  cupertino_icons: ^1.0.8

# =============================================================================
# 开发依赖配置说明
# =============================================================================
# 代码生成工具链负责以下模块：
#   1. freezed + json_serializable → 不可变数据模型（features/*/data/models、
#      presentation/providers/*_state.dart），生成 .freezed.dart 与 .g.dart
#   2. drift_dev → drift 数据库（core/database/），生成 .drift.dart
#   3. riverpod_generator → Provider 代码（features/*/presentation/providers/），
#      生成 .g.dart
#
# 代码生成执行命令：
#   一次性：dart run build_runner build --delete-conflicting-outputs
#   持续监听：dart run build_runner watch -d
# =============================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  # ---- 代码生成工具链 ----
  build_runner: ^2.4.13         # 代码生成运行器
  freezed: ^3.0.0               # 不可变模型代码生成（3.x 与 riverpod_generator 3.x 兼容）
  json_serializable: ^6.8.0     # JSON 序列化代码生成
  drift_dev: ^2.20.0            # drift 数据库代码生成
  riverpod_generator: ^3.0.0    # Riverpod 3.x Provider 代码生成
  riverpod_lint: ^3.0.0         # Riverpod 专用 lint 规则
  custom_lint: ^0.8.1           # 自定义 lint 启用器（0.8+ 兼容 freezed_annotation 3.x）

  # ---- 测试 ----
  mocktail: ^1.0.4              # 无依赖注入的 mock 库

  # ---- Lint ----
  flutter_lints: ^6.0.0

# =============================================================================
# Flutter 配置
# =============================================================================
flutter:
  uses-material-design: true
  generate: true                # 启用 l10n 代码生成（配合 l10n.yaml）

  assets:
    - assets/images/
    - assets/icons/
